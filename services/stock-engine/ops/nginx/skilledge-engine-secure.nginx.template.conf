# S8.2 SkillEdge secure Stock Engine ingress.
# Replace __SERVER_NAME__ and __ENGINE_PROXY_SECRET__.
# Public requests require header:
# X-SkillEdge-Engine-Key: <secret>

map $http_x_skilledge_engine_key $skilledge_engine_authorized {
    default 0;
    "__ENGINE_PROXY_SECRET__" 1;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;

    location / {
        if ($skilledge_engine_authorized = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
