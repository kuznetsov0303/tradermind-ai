name: Trigger Vercel Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: VERCEL_DEPLOY_HOOK_URL is empty"
            exit 1
          fi

          echo "Calling Vercel deploy hook..."
          HTTP_CODE=$(curl -sS -o vercel-response.json -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")

          echo "Vercel HTTP status: $HTTP_CODE"
          echo "Vercel response:"
          cat vercel-response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Vercel hook failed"
            exit 1
          fi
